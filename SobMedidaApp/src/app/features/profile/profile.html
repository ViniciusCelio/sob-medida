<div style="max-width:860px; margin:2rem auto; padding:0 1rem; display:flex; flex-direction:column; gap:1.5rem;">

  <!-- Header -->
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:42px; height:42px; border-radius:10px; background:#e8eaf6;
                  display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <mat-icon style="color:#3f51b5; font-size:22px; width:22px; height:22px;">person</mat-icon>
      </div>
      <div>
        <h2 style="font-size:1.4rem; font-weight:500; margin:0; color:rgba(0,0,0,0.87);">
          Meu Perfil
        </h2>
        <span style="font-size:12px; color:rgba(0,0,0,0.54);">
          Gerencie suas informações pessoais e profissionais
        </span>
      </div>
    </div>

    <a routerLink="/dashboard" style="text-decoration:none;">
      <button mat-stroked-button color="primary">
        <mat-icon>arrow_back</mat-icon> Voltar ao Dashboard
      </button>
    </a>
  </div>

  <!-- Card com abas -->
  <div style="background:#fff; border:1px solid rgba(0,0,0,0.12); border-radius:12px; overflow:hidden;">
    <mat-tab-group animationDuration="200ms">

      <mat-tab label="Pessoal">
        <div class="tab-body"><app-personal-info /></div>
      </mat-tab>

      <mat-tab label="Experiência">
        <div class="tab-body"><app-experience /></div>
      </mat-tab>

      <mat-tab label="Educação">
        <div class="tab-body"><app-education /></div>
      </mat-tab>

      <mat-tab label="Habilidades">
        <div class="tab-body"><app-skills /></div>
      </mat-tab>

      <mat-tab label="Projetos">
        <div class="tab-body"><app-projects /></div>
      </mat-tab>

      <mat-tab label="Certificações">
        <div class="tab-body"><app-certifications /></div>
      </mat-tab>

    </mat-tab-group>
  </div>

</div>
