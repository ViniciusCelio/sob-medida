<h2 mat-dialog-title>{{ data.entry ? 'Editar Educação' : 'Nova Educação' }}</h2>

<mat-dialog-content>
    <form>
        <div class="form-row">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Grau / Título</mat-label>
                <input matInput [(ngModel)]="form.degree" name="degree" placeholder="Bacharelado, Mestrado..." />
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Área de Estudo</mat-label>
                <input matInput [(ngModel)]="form.fieldOfStudy" name="fieldOfStudy" placeholder="Ciência da Computação..." />
            </mat-form-field>
        </div>

        <div class="form-row">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Instituição</mat-label>
                <input matInput [(ngModel)]="form.institution" name="institution" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Localização</mat-label>
                <input matInput [(ngModel)]="form.location" name="location" />
            </mat-form-field>
        </div>

        <div class="form-row">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Data de Início</mat-label>
                <input matInput type="date" [(ngModel)]="form.startDate" name="startDate" min="1900-01-01" max="2099-12-31" />
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width" *ngIf="!form.isCurrentlyStudying">
                <mat-label>Data de Término</mat-label>
                <input matInput type="date" [(ngModel)]="form.endDate" name="endDate" min="1900-01-01" max="2099-12-31" />
            </mat-form-field>
        </div>

        <mat-checkbox [(ngModel)]="form.isCurrentlyStudying" name="isCurrentlyStudying" (change)="onCurrentlyStudyingChange()">
            Atualmente estudo aqui
        </mat-checkbox>

        <mat-form-field appearance="outline" class="full-width" style="margin-top: 1rem;">
            <mat-label>Descrição</mat-label>
            <textarea matInput [(ngModel)]="form.description" name="description" rows="3"></textarea>
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-stroked-button (click)="cancel()">Cancelar</button>
    <button mat-raised-button color="primary" (click)="save()" [disabled]="isLoading">
        <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
        <span *ngIf="!isLoading">{{ data.entry ? 'Atualizar' : 'Salvar' }}</span>
    </button>
</mat-dialog-actions>
