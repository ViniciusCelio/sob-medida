<div style="min-height:100vh; display:flex; align-items:center; justify-content:center;
            background:#f5f6fa; padding:1rem;">

  <div style="width:100%; max-width:420px; background:#fff;
              border:1px solid rgba(0,0,0,0.12); border-radius:16px; overflow:hidden;">

    <!-- Cabeçalho colorido -->
    <div style="background:#3f51b5; padding:2rem 2rem 1.75rem; text-align:center;">
      <div style="width:56px; height:56px; border-radius:14px; background:rgba(255,255,255,0.15);
                  display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;">
        <mat-icon style="color:#fff; font-size:28px; width:28px; height:28px;">description</mat-icon>
      </div>
      <h1 style="color:#fff; font-size:1.4rem; font-weight:500; margin:0;">Sob Medida</h1>
      <p style="color:rgba(255,255,255,0.65); font-size:13px; margin:5px 0 0;">
        Currículo profissional com inteligência artificial
      </p>
    </div>

    <!-- Corpo do formulário -->
    <div style="padding:2rem;">
      <h2 style="font-size:1rem; font-weight:500; color:rgba(0,0,0,0.6);
                 margin:0 0 1.5rem; text-transform:uppercase; letter-spacing:0.5px;">
        Acessar Conta
      </h2>

      <form class="auth-form" (ngSubmit)="onSubmit()">

        <mat-form-field appearance="outline" style="width:100%;">
          <mat-label>E-mail</mat-label>
          <input matInput type="email" [(ngModel)]="email" name="email" required>
          <mat-icon matSuffix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" style="width:100%;">
          <mat-label>Senha</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'"
                 [(ngModel)]="password" name="password" required>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        @if (errorMessage) {
          <div style="display:flex; align-items:center; gap:8px; padding:10px 12px;
                      background:#ffebee; border-radius:8px; margin-bottom:4px;">
            <mat-icon style="color:#c62828; font-size:18px; width:18px; height:18px; flex-shrink:0;">
              error_outline
            </mat-icon>
            <span style="font-size:13px; color:#c62828;">{{ errorMessage }}</span>
          </div>
        }

        <button mat-raised-button color="primary" type="submit"
                [disabled]="isLoading" style="width:100%; height:44px; margin-top:4px;">
          @if (isLoading) {
            <mat-spinner diameter="22"></mat-spinner>
          } @else {
            <span>Entrar</span>
          }
        </button>

      </form>

      <p style="text-align:center; font-size:13px; color:rgba(0,0,0,0.5); margin:1.5rem 0 0;">
        Não tem uma conta?
        <a routerLink="/register"
           style="color:#3f51b5; text-decoration:none; font-weight:500;">
          Cadastre-se aqui
        </a>
      </p>
    </div>

  </div>
</div>
